<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meridian — Work, together</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#27332e;background:#f9faf8}button,a{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}.sidebar{padding:26px 18px;background:#f0f2ee;border-right:1px solid #e4e7e1}.brand{font-weight:700;font-size:23px;letter-spacing:-1px;padding:0 9px 38px}.brand span{display:inline-grid;place-items:center;background:#263f34;color:#e8f1df;width:27px;height:27px;border-radius:8px;margin-right:8px}.space{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#89918a;padding:10px}.nav{display:block;border:0;border-radius:7px;background:transparent;padding:12px;width:100%;text-align:left;color:#667168;margin-bottom:5px}.nav.active{background:#e0e7dc;color:#233d2d;font-weight:600}.nav i{font-style:normal;margin-right:12px;color:#879485}.team{position:absolute;bottom:25px;font-size:12px;line-height:1.8;color:#6f7d70;padding:10px}.avatar{display:inline-grid;place-items:center;width:31px;height:31px;background:#dbe3d5;border:2px solid #f9faf8;border-radius:50%;font-size:11px;color:#587159;margin-left:-6px}.main{padding:0 43px}.top{height:73px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e9ece6;font-size:12px;color:#7c847d}.top b{color:#364b3d;font-weight:500}.badge{border:1px solid #d8e0d1;background:#f1f5ec;color:#6d825e;border-radius:6px;padding:6px 10px;font-size:11px}.heading{display:flex;justify-content:space-between;align-items:center;margin:38px 0 27px}h1{font-size:30px;font-weight:550;letter-spacing:-1.1px;margin:0 0 9px}p{font-size:13px;color:#899088;margin:0}.primary{border:0;color:white;background:#35583f;padding:10px 16px;border-radius:7px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:32px}.stat{background:white;border:1px solid #e5e9df;border-radius:10px;padding:22px}.stat label{font-size:12px;color:#80897e}.stat strong{display:block;font-size:28px;font-weight:500;margin-top:14px}.stat small{font-size:11px;color:#819b6d;float:right;margin-top:9px}.section{font-size:14px;font-weight:550;margin:22px 0 15px}.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.project{background:white;border:1px solid #e3e7dc;border-radius:10px;padding:23px;text-align:left;transition:transform .25s}.project:hover{transform:translateY(-3px)}.project-icon{background:#f2e4ce;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;color:#9d895e;margin-bottom:24px}.project:nth-child(2) .project-icon{background:#e3e5f0;color:#8e91b0}.project:nth-child(3) .project-icon{background:#e3ecd9;color:#6e8860}.project h3{font-size:15px;font-weight:550;margin:0 0 8px}.project p{font-size:12px;height:38px;line-height:1.6}.progress{height:5px;background:#edf0e8;border-radius:5px;margin:22px 0 11px}.progress span{display:block;height:5px;border-radius:5px;background:#8caa75}.project-footer{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#8b9388;margin-top:20px}.activity{margin-top:28px;background:white;border:1px solid #e5e9df;border-radius:10px;padding:20px 24px}.activity p{margin:13px 0;font-size:12px}.activity em{font-style:normal;color:#45543f}.tabs{display:flex;gap:25px;border-bottom:1px solid #e2e6dc;margin-bottom:25px}.tabs button{border:0;background:transparent;padding:12px 0;font-size:12px;color:#8b9287}.tabs button.active{color:#314b35;border-bottom:2px solid #5d7d51}.taskrow{display:flex;align-items:center;background:white;border-bottom:1px solid #ecefe6;padding:19px 20px;gap:13px;font-size:13px}.taskrow:first-child{border-radius:9px 9px 0 0}.taskrow:last-child{border-radius:0 0 9px 9px}.check{width:15px;height:15px;border:1px solid #c9d2c2;border-radius:4px}.taskrow small{margin-left:auto;color:#8b9386;font-size:11px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.column{background:#f0f2ec;border-radius:9px;padding:16px}.column h3{font-size:12px;margin:3px 0 19px;font-weight:500}.column h3 span{float:right;background:#e3e7dd;border-radius:4px;padding:1px 6px;color:#84917a}.card{background:white;padding:18px;border:1px solid #e1e6d9;border-radius:8px;margin-bottom:12px;box-shadow:0 2px 2px #263f3404}.card b{display:block;font-size:12px;font-weight:500;line-height:1.7}.card label{display:inline-block;font-size:9px;padding:3px 6px;background:#f3eee1;color:#a18f59;border-radius:4px;margin-bottom:11px}.card p{margin-top:22px;font-size:10px}.chart{height:230px;display:flex;gap:22px;align-items:end;padding:20px 27px;border-bottom:1px solid #ebeee5}.bar{background:#aac496;width:45px;border-radius:5px 5px 0 0;position:relative}.bar span{position:absolute;bottom:-30px;font-size:10px;color:#9aa38e;width:100%;text-align:center}.chartbox{background:white;border:1px solid #e5e9df;border-radius:10px;padding:23px}.chartbox h3{font-size:14px;font-weight:500;margin:0}.chartbox p{margin-top:8px;font-size:11px}.chartlegend{font-size:10px;color:#8d9981;padding-top:40px}.welcome{background:#eaf0e1;padding:20px 23px;border:1px solid #dbe6ce;border-radius:10px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center}.welcome p{color:#829374}.welcome h3{font-size:14px;margin:0 0 6px;font-weight:500}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><span>m</span>meridian</div><div class="space">Studio workspace</div><button class="nav active" data-page="overview"><i>⌂</i>Overview</button><button class="nav" data-page="projects"><i>▦</i>Projects</button><button class="nav" data-page="analytics"><i>↗</i>Analytics</button><div class="space" style="margin-top:26px">Your team</div><button class="nav"><i>◌</i>Design studio</button><button class="nav"><i>◌</i>Product team</button><div class="team"><span class="avatar">AC</span> Alex Chen<br>Meridian Studio · Sample app</div></aside><main class="main"><div class="top"><span>Workspace <span style="margin:0 10px">/</span><b id="crumb">Overview</b></span><span class="badge">Studio team <span style="margin-left:12px">⌄</span></span></div><div id="view"></div></main></div>
<script>
const view=document.getElementById('view');
const header=(title,sub,button='')=>`<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${button?`<button class="primary">${button}</button>`:''}</div>`;
const stats=()=>`<div class="stats"><div class="stat"><label>Active projects</label><strong>12<small>+2 this month</small></strong></div><div class="stat"><label>Tasks completed</label><strong>84<small>↑ 18% this month</small></strong></div><div class="stat"><label>Team momentum</label><strong>On track<small>All systems moving</small></strong></div></div>`;
const projects=()=>`<div class="projects">${[['Website refresh','A thoughtful new home for our brand.','◈','72%','8'],['Mobile experience','Small screens. A bigger experience.','▤','45%','6'],['Brand system','One language for everything we make.','✳','91%','4']].map((p,i)=>`<button class="project" data-project="${i}"><div class="project-icon">${p[2]}</div><h3>${p[0]}</h3><p>${p[1]}</p><div class="progress"><span style="width:${p[3]}"></span></div><p style="height:auto;font-size:10px">${p[3]} complete</p><div class="project-footer"><span><i class="avatar">AC</i><i class="avatar">JL</i><i class="avatar">MK</i></span><span>${p[4]} days to milestone →</span></div></button>`).join('')}</div>`;
function show(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumb').textContent=page[0].toUpperCase()+page.slice(1);if(page==='overview')view.innerHTML=header('Good morning, Alex.','Here’s what is moving forward today.','New project')+`<div class="welcome"><div><h3>A little clarity goes a long way.</h3><p>Your team has completed 12 tasks this week. Keep the good work moving.</p></div><span style="font-size:26px;color:#92a47d">✳</span></div>`+stats()+`<div class="section">Your projects</div>`+projects();if(page==='projects')view.innerHTML=header('Projects','A clear home for every idea, every task, every team.','New project')+projects()+`<div class="activity"><div class="section" style="margin-top:0">Latest activity</div><p><em>Jamie Lee</em> completed Homepage wireframes <span style="float:right">12 minutes ago</span></p><p><em>Morgan Kim</em> added an update to Brand system <span style="float:right">1 hour ago</span></p></div>`;if(page==='analytics')view.innerHTML=header('A little perspective.','Understand your team’s progress, without the guesswork.','This month ▾')+stats()+`<div class="chartbox"><h3>Work completed</h3><p>Small steps, steady progress.</p><div class="chart">${[36,50,43,76,66,89,85,115,100,139,132,164].map((h,i)=>`<div class="bar" style="height:${h}px"><span>${i+1}</span></div>`).join('')}</div><div class="chartlegend">● Completed tasks &nbsp; &nbsp; October 2026</div></div>`;bind()}
function detail(board=false){document.getElementById('crumb').textContent='Projects / Website refresh';view.innerHTML=header('Website refresh','A thoughtful new home for our brand.','Project settings')+`<div class="tabs"><button class="${!board?'active':''}" id="list">List</button><button class="${board?'active':''}" id="board">Board</button><button>Files</button><button>Activity</button></div>`+(board?`<div class="board">${[['To do',[['Design','Explore the mobile navigation'],['Content','Write the product story']]],['In progress',[['Design','Build the component library'],['Development','Create the interactive prototype']]],['Done',[['Research','Map the customer journey'],['Design','Homepage wireframes']]]].map(([title,cards])=>`<div class="column"><h3>${title}<span>${cards.length}</span></h3>${cards.map(([tag,text])=>`<div class="card"><label>${tag}</label><b>${text}</b><p>Oct 14 <span class="avatar" style="float:right">JL</span></p></div>`).join('')}</div>`).join('')}</div>`:`<div>${['Map the customer journey','Homepage wireframes','Build the component library','Create the interactive prototype','Explore the mobile navigation','Write the product story'].map((t,i)=>`<div class="taskrow"><span class="check" style="${i<2?'background:#91ac79;border-color:#91ac79':''}"></span>${t}<small>${i<2?'Done':i<4?'In progress':'To do'} &nbsp; &nbsp; Oct ${10+i}</small><span class="avatar">JL</span></div>`).join('')}</div>`);document.getElementById('board').onclick=()=>detail(true);document.getElementById('list').onclick=()=>detail(false);bind()}
function bind(){document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>detail());document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page))}show('overview');
</script></body></html>
