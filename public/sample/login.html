<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Meridian demo sign in</title><style>body{font-family:system-ui;background:#f4f6ef;display:grid;place-items:center;min-height:100vh;margin:0}form{padding:42px;background:white;border:1px solid #e4e8dc;border-radius:16px;width:310px}h1{font-size:25px;letter-spacing:-1px}label{display:block;margin-top:22px;font-size:12px;color:#66715e}input{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #dbe2d3;border-radius:7px}button{width:100%;padding:12px;background:#35583f;color:white;border:0;border-radius:7px;margin-top:25px}p{font-size:12px;color:#87907f}</style></head><body><form><h1>Welcome to Meridian.</h1><p>Sample app · Use demo@meridian.app / demo</p><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" required></label><button>Sign in</button><p id="error"></p></form><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();if(document.querySelector('input[type=email]').value==='demo@meridian.app'&&document.querySelector('input[type=password]').value==='demo'){localStorage.setItem('meridian-demo','signed-in');location.href='/sample/'}else document.getElementById('error').textContent='Incorrect demo credentials.'}</script></body></html>
